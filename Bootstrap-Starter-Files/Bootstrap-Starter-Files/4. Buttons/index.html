<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <title>Bootstrap </title>
</head>

<body>
   <h1>Buttons</h1>
   <button>Normal botton</button>
   <button class="btn">button with btn</button>
   <button class="btn btn-primary">primary button</button>
   <button class="btn btn-secondary">secondary button</button>
   <button class="btn btn-success">success button</button>
   <button class="btn btn-warning">warning button</button>
   <button class="btn btn-danger">danger button</button>
   <button class="btn btn-link"> link button</button>
   <a class="btn btn-info" href="#">link element</a>

   <!-- Sizes of the button -->
   <h1>Buttons with different sizes</h1>
   <button class="btn btn-primary">Normal button</button>
   <button class="btn btn-primary btn-lg">large button</button>
   <button class="btn btn-primary btn-sm">small button</button>

   <!-- outlined buttons -->
    <h1>Outlined buttons</h1>
    <button class="btn btn-outline-primary">primary outlined</button>
    <button class="btn btn-outline-secondary">secondary outlined</button>
    <button class="btn btn-outline-success">success outlined</button>
    <button class="btn btn-outline-danger">danger outlined</button>
    
    <!-- Grouping buttons -->
    <div class="btn-group">
<button class="btn btn-primary">button 1</button>
<button class="btn btn-secondary">button 2</button>
<button class="btn btn-danger">button 3</button>
    </div>
</body>

</html>
