<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <title>Bootstrap </title>
</head>

<body>
    <!-- container is very important in grid, with out container you cannot make grid -->
    <h1>Bootstrap Grid</h1>
    <div class="Container ">
   <div class="row">
    <div class="col border">column 1</div>
    <div class="col border">column 2</div>
    <div class="col border">column 3</div>
    <div class="col border">column 4</div>
    <div class="col border">column 5</div>
    <div class="col border">column 6</div>
    <div class="col border">column 7</div>
    <div class="col border">column 8</div>
    <div class="col border">column 9</div>
    <div class="col border">column 10</div>
    <div class="col border">column 11</div>
    <div class="col border">column 12</div>
   </div>
  
   <div class="row">
    <!-- Row with only 3 columns -->
     <!-- each column automatically gets an equal width -->
    <div class="col border">column 1</div>
    <div class="col border">column 2</div>
    <div class="col border">column 3</div>

   </div>

   <div class="row">
 <div class="  col-sm-6  border">column 1</div>
 <div class="col-md-4 border">column 2</div>
 <div class="col border">column 3</div>
 <div class="col-1 border">column 4</div>
   </div>

    </div>

</body>

</html>
